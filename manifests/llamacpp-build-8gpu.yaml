apiVersion: v1
kind: Pod
metadata:
  name: llamacpp-build-8gpu
  namespace: llm
  labels:
    sprint: sprint-025
    role: full-256e-target
spec:
  containers:
  - command: ["sleep", "infinity"]
    image: nvidia/cuda:12.2.2-devel-ubuntu22.04
    name: build
    resources:
      limits:
        nvidia.com/gpu: 8
      requests:
        nvidia.com/gpu: 8
    volumeMounts:
    - mountPath: /workspace
      name: workspace
    - mountPath: /models
      name: models
      readOnly: true
  nodeSelector:
    kubernetes.io/hostname: gpu-01
  restartPolicy: Never
  volumes:
  - emptyDir:
      sizeLimit: 50Gi
    name: workspace
  - name: models
    persistentVolumeClaim:
      claimName: llm-models-local
